name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agentlab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agent -d agentlab"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://agent:agent@localhost:5432/agentlab
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # P9 adds the trajectory-eval gate here.
